<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baby Routine Dashboard</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>">
<!--
  Baby Routine & Sleep Analytics Dashboard — single-file, zero-install, privacy-first.
  ─────────────────────────────────────────────────────────────────────────────
  • Open by double-clicking, or drop onto any static host (GitHub Pages, Netlify Drop, LAN server).
  • Data sources: Google Apps Script endpoint (live), local CSV import, or the built-in demo week.
  • All settings live in this browser's localStorage; use Settings → Backup to move them between devices.
  • External libraries (CDN): Chart.js 4 (charts) and PapaParse 5 (CSV). If offline, the app still
    loads — CSV parsing falls back to a built-in parser and the timeline/tables keep working.
-->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
/* ───────────────────────────── Theme tokens ───────────────────────────── */
:root{
  --bg:#f5f6fa; --panel:#ffffff; --panel2:#f0f2f8; --text:#0f172a; --muted:#5b6782; --faint:#94a0b8;
  --border:#e2e6ef; --grid:rgba(15,23,42,.05); --grid2:rgba(15,23,42,.13);
  --accent:#4f46e5; --accent-soft:rgba(79,70,229,.12);
  --good:#059669; --warn:#d97706; --bad:#dc2626;
  --warn-soft:rgba(217,119,6,.14); --bad-soft:rgba(220,38,38,.13); --good-soft:rgba(5,150,105,.12);
  --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.06);
  --radius:12px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#0a0f1d; --panel:#111a2d; --panel2:#18223a; --text:#e6eaf5; --muted:#9aa6c2; --faint:#64708c;
  --border:#243050; --grid:rgba(255,255,255,.04); --grid2:rgba(255,255,255,.11);
  --accent:#8b85ff; --accent-soft:rgba(139,133,255,.16);
  --good:#34d399; --warn:#fbbf24; --bad:#f87171;
  --warn-soft:rgba(251,191,36,.14); --bad-soft:rgba(248,113,113,.15); --good-soft:rgba(52,211,153,.13);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.hidden{display:none!important}
.muted{color:var(--muted)} .faint{color:var(--faint)} .mono{font-family:var(--mono)}
.row{display:flex;align-items:center;gap:8px} .wrap{flex-wrap:wrap} .grow{flex:1} .sp{justify-content:space-between}

/* ───────────────────────────── Buttons & inputs ───────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--panel);border-radius:9px;padding:6px 11px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--panel2)}
.btn.sm{padding:3px 8px;font-size:12.5px;border-radius:7px}
.btn.icon{padding:6px 8px}
.btn.danger{color:var(--bad)}
.btn svg{width:16px;height:16px;flex:none}
.btn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
input[type=text],input[type=url],input[type=password],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{
  background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 9px;min-width:0}
input:focus,select:focus,textarea:focus,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=color]{width:34px;height:26px;border:1px solid var(--border);border-radius:6px;padding:1px;background:var(--panel);cursor:pointer}
label.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
label.field>input,label.field>select,label.field>textarea{color:var(--text);font-size:14px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:5px 10px;cursor:pointer;font-size:13px}
.seg button+button{border-left:1px solid var(--border)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.switch{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none;font-size:13px}
.switch input{appearance:none;width:32px;height:18px;border-radius:99px;background:var(--grid2);position:relative;cursor:pointer;transition:background .15s;margin:0}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(14px)}

/* ───────────────────────────── Pills ───────────────────────────── */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--panel2);color:var(--muted);white-space:nowrap;line-height:1.5}
.pill.demo{background:#fef3c7;color:#92400e}
[data-theme="dark"] .pill.demo{background:rgba(251,191,36,.18);color:#fcd34d}
.pill.live{background:var(--good-soft);color:var(--good)}
.pill.visit{background:rgba(236,72,153,.14);color:#db2777}
[data-theme="dark"] .pill.visit{color:#f9a8d4}
.pill.after{background:rgba(168,85,247,.14);color:#9333ea}
[data-theme="dark"] .pill.after{color:#d8b4fe}
.pill.split{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn);cursor:pointer;border:0}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}

/* ───────────────────────────── Layout: header, filter bar, tabs ───────────────────────────── */
header.app{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
header.app h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
header.app .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px}
header.app .actions{margin-left:auto;display:flex;gap:6px;align-items:center}
.filterbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:10px 18px}
.filterbar .line{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.filterbar .line+.line{margin-top:8px}
.filterbar .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:700}
.filterbar .search{position:relative;flex:1;min-width:160px;max-width:300px}
.filterbar .search input{width:100%;padding-left:28px}
.filterbar .search svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--faint)}
.chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);background:var(--panel);border-radius:99px;padding:2px 9px 2px 6px;font-size:12px;cursor:pointer;user-select:none;transition:opacity .15s}
.chip .sw{width:10px;height:10px;border-radius:3px;flex:none}
.chip.off{opacity:.38;text-decoration:line-through}
.chip.grp{font-weight:700;border-style:dashed;padding-left:9px}
.chip-sep{width:1px;height:18px;background:var(--border);margin:0 3px}
#filterToggle{display:none}
.tabs{display:flex;gap:2px;padding:10px 18px 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:9px 9px 0 0;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap;border-bottom:2px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);background:var(--panel)}
main{padding:14px 18px 40px}
.view{display:none} .view.on{display:block}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px;min-width:0}
.card h2{font-size:15px;margin:0;font-weight:700}
.card .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid2>.card{margin-bottom:0}
.chartbox{position:relative;height:300px}
.chartbox.tall{height:360px}
.empty{padding:36px 12px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);margin-bottom:4px;font-size:15px}

/* ───────────────────────────── KPI tiles ───────────────────────────── */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .k{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:24px;font-weight:750;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--grid2)}
.kpi.good::before{background:var(--good)} .kpi.warn::before{background:var(--warn)} .kpi.bad::before{background:var(--bad)}
.kpi.good .s b{color:var(--good)} .kpi.warn .s b{color:var(--warn)} .kpi.bad .s b{color:var(--bad)}

/* ───────────────────────────── Timeline ───────────────────────────── */
.tl-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tl-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:10px 0 2px}
.tl-legend span{display:inline-flex;align-items:center;gap:5px}
.tl-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.tl-legend i.ln{width:14px;height:0;border-top:2px dashed;border-radius:0}
.tl-scroll{overflow-x:auto;margin:0 -16px;padding:0 16px}
.tl{--lab:132px;min-width:760px;position:relative}
.tl-head{display:grid;grid-template-columns:var(--lab) 1fr;position:sticky;top:0}
.tl-axis{position:relative;height:22px;border-bottom:1px solid var(--border)}
.tl-axis span{position:absolute;bottom:3px;transform:translateX(-50%);font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.tl-row{display:grid;grid-template-columns:var(--lab) 1fr;border-bottom:1px solid var(--border);cursor:pointer}
.tl-row:hover{background:var(--grid)}
.tl-lab{padding:6px 8px 6px 0;display:flex;flex-direction:column;justify-content:center;gap:3px;position:sticky;left:0;background:var(--panel);z-index:3}
.tl-row:hover .tl-lab{background:color-mix(in srgb,var(--panel) 94%,var(--text))}
.tl-lab .d{font-weight:650;font-size:13px;white-space:nowrap}
.tl-lab .pills{display:flex;gap:3px;flex-wrap:wrap}
.tl-track{position:relative;
  background-image:
    repeating-linear-gradient(to right,var(--grid2) 0 1px,transparent 1px calc(100%/24)),
    repeating-linear-gradient(to right,var(--grid) 0 1px,transparent 1px calc(100%/96));
}
.tl-track .night-shade{position:absolute;top:0;bottom:0;background:rgba(79,70,229,.035);pointer-events:none}
[data-theme="dark"] .tl-track .night-shade{background:rgba(139,133,255,.05)}
.ev{position:absolute;border-radius:5px;font-size:10.5px;line-height:1;display:flex;align-items:center;gap:3px;padding:0 4px;overflow:hidden;white-space:nowrap;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:opacity .15s,transform .1s;z-index:2}
.ev:hover{z-index:5;transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.ev.cl{border-top-left-radius:0;border-bottom-left-radius:0}
.ev.cr{border-top-right-radius:0;border-bottom-right-radius:0}
.ev.dim,.mk.dim{opacity:.16}
.ev.hit{box-shadow:0 0 0 2px var(--text)}
.ev.late{box-shadow:0 0 0 2px var(--bad)}
.mk{position:absolute;width:14px;height:14px;margin-left:-7px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;cursor:pointer;z-index:4;box-shadow:0 0 0 2px var(--panel)}
.mk:hover{transform:scale(1.35)}
.ov-band{position:absolute;pointer-events:none;z-index:1;border:1px dashed}
.ov-line{position:absolute;pointer-events:none;z-index:4}
/* vertical (columns) orientation */
.tl.v{display:flex;min-width:0}
.tl.v .tl-vaxis{position:relative;width:42px;flex:none;margin-top:var(--vh)}
.tl.v .tl-vaxis span{position:absolute;right:6px;transform:translateY(-50%);font-size:10.5px;color:var(--faint)}
.tl.v .cols{display:flex;flex:1;gap:4px}
.tl.v .col{flex:1;min-width:84px;cursor:pointer;border-radius:8px}
.tl.v .col:hover{background:var(--grid)}
.tl.v .col .tl-lab{height:var(--vh);position:static;padding:4px 2px;align-items:center;text-align:center;background:transparent}
.tl.v .col .tl-lab .pills{justify-content:center}
.tl.v .tl-track{background-image:
    repeating-linear-gradient(to bottom,var(--grid2) 0 1px,transparent 1px calc(100%/24)),
    repeating-linear-gradient(to bottom,var(--grid) 0 1px,transparent 1px calc(100%/96));
    border-left:1px solid var(--border);border-right:1px solid var(--border)}
.tl.v .ev{flex-direction:column;justify-content:flex-start;padding:3px 2px;font-size:10px;align-items:center}
.tl.v .mk{margin-left:0;margin-top:-7px}

/* tooltip */
#tip{position:fixed;z-index:100;pointer-events:none;background:var(--panel);border:1px solid var(--border);box-shadow:0 10px 30px rgba(0,0,0,.22);border-radius:10px;padding:9px 11px;max-width:300px;font-size:12.5px;opacity:0;transition:opacity .1s}
#tip.on{opacity:1}
#tip .t{font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:4px}
#tip .t i{width:10px;height:10px;border-radius:3px}
#tip .n{margin-top:5px;color:var(--muted);white-space:pre-wrap}

/* ───────────────────────────── Drawer & modals ───────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(5,10,25,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--panel);z-index:61;box-shadow:-10px 0 40px rgba(0,0,0,.25);transform:translateX(105%);transition:transform .25s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:8px}
.drawer .body{padding:14px 16px;overflow-y:auto;flex:1}
.totals{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.totals div{background:var(--panel2);border-radius:9px;padding:8px 10px}
.totals .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.totals .v{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.evlist{list-style:none;margin:0;padding:0}
.evlist li{display:grid;grid-template-columns:92px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);border-radius:6px}
.evlist li.hit{background:var(--accent-soft);padding-left:6px;padding-right:6px}
.evlist .tm{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:1px}
.evlist .c{font-weight:650;display:flex;align-items:center;gap:6px}
.evlist .c i{width:10px;height:10px;border-radius:3px;flex:none}
.evlist .x{font-size:12.5px;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:none;opacity:0;transition:opacity .2s}
.modal.on{pointer-events:auto;opacity:1}
.modal .box{background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(920px,100%);max-height:min(88vh,900px);display:flex;flex-direction:column;overflow:hidden}
.modal .box.narrow{width:min(620px,100%)}
.modal .mhead{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border);gap:10px}
.modal .mhead h3{margin:0;font-size:16px}
.modal .mbody{display:flex;min-height:0;flex:1}
.modal .mnav{width:180px;flex:none;border-right:1px solid var(--border);padding:10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.modal .mnav button{text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600}
.modal .mnav button.on{background:var(--accent-soft);color:var(--accent)}
.modal .mpane{flex:1;overflow-y:auto;padding:16px 18px}
.modal .mpane section{display:none} .modal .mpane section.on{display:block}
.modal h4{margin:18px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.modal h4:first-child{margin-top:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
pre.code{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px;font-family:var(--mono);font-size:12px;overflow:auto;max-height:340px;white-space:pre;margin:8px 0}
ol.steps{padding-left:20px;margin:6px 0} ol.steps li{margin:5px 0}
.tpl-items{width:100%;border-collapse:collapse;font-size:13px}
.tpl-items td{padding:4px 4px 4px 0}
.tpl-items input,.tpl-items select{width:100%}
.catrow{display:grid;grid-template-columns:22px 1fr 110px 40px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px}

/* ───────────────────────────── Tables ───────────────────────────── */
.tbl-wrap{overflow:auto;max-height:620px;border:1px solid var(--border);border-radius:10px}
table.dt{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
table.dt th{position:sticky;top:0;background:var(--panel2);text-align:left;font-weight:650;padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap;user-select:none;z-index:1}
table.dt th:hover{color:var(--accent)}
table.dt th .ar{opacity:.5;font-size:10px;margin-left:3px}
table.dt td{padding:6px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
table.dt td.notes{white-space:normal;min-width:220px;max-width:420px;color:var(--muted)}
table.dt tr:hover td{background:var(--grid)}
table.dt td.w{background:var(--warn-soft);color:var(--warn);font-weight:650}
table.dt td.b{background:var(--bad-soft);color:var(--bad);font-weight:650}
table.dt td.g{color:var(--good);font-weight:650}
table.dt tr.clickable{cursor:pointer}
.cmp{width:100%;border-collapse:collapse;font-size:13px}
.cmp th,.cmp td{padding:8px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
.cmp th{font-size:12px;color:var(--muted);font-weight:650}
.cmp td.m{font-weight:600;color:var(--muted);font-size:12.5px;width:28%}
.cmp .bar{height:6px;border-radius:3px;margin-top:4px;background:var(--grid2);overflow:hidden}
.cmp .bar i{display:block;height:100%;border-radius:3px}
.cmp .val{font-weight:700;font-variant-numeric:tabular-nums}

/* bath cadence */
.bath-grid{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.bath-grid div{width:26px;height:34px;border-radius:6px;background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9.5px;color:var(--faint)}
.bath-grid div.y{background:rgba(20,184,166,.18);color:#0f766e;font-weight:700}
[data-theme="dark"] .bath-grid div.y{color:#5eead4}
.bigstat{display:flex;gap:22px;flex-wrap:wrap}
.bigstat .v{font-size:28px;font-weight:750;letter-spacing:-.02em}
.bigstat .k{font-size:12px;color:var(--muted)}

/* drop zone & toast */
#dropzone{position:fixed;inset:0;z-index:90;background:rgba(79,70,229,.18);border:3px dashed var(--accent);display:none;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--accent);backdrop-filter:blur(2px)}
#dropzone.on{display:flex}
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:110;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
/* v1.37.1: toasts are for reading only: taps go through to what's underneath (no tap-to-search / Lens on their text) */
.toast{pointer-events:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background:var(--text);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .2s ease}
.toast.err{background:var(--bad);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.warnlist{font-size:12.5px;max-height:420px;overflow:auto;border:1px solid var(--border);border-radius:10px}
.warnlist div{padding:6px 10px;border-bottom:1px solid var(--border)}
.warnlist div b{font-family:var(--mono);font-weight:600;color:var(--muted);margin-right:6px}

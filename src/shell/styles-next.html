<style>
/* ───────────── V7 phase 1 (redesign branch): mobile-first Home, one-tap logging, motion ───────────── */
:root{--spring:cubic-bezier(.22,1.28,.36,1);--ease:cubic-bezier(.2,.8,.2,1);--tap:48px}
.m2home{display:none}
/* Insights hub (all widths) */
.m2page{max-width:720px;margin:0 auto}
.m2h{font-size:22px;margin:4px 2px 12px}
.m2insact{display:flex;gap:10px;margin-bottom:12px}
.m2insact .btn{flex:1;justify-content:center;min-height:var(--tap);font-size:15px;border-radius:14px}
.m2inslist{display:flex;flex-direction:column;gap:10px}
.m2ins{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;min-height:84px;border-radius:18px;border:1px solid var(--border);background:var(--panel);box-shadow:var(--shadow);color:var(--text);font:inherit;cursor:pointer;transition:transform .12s var(--ease),box-shadow .12s}
.m2ins .e{font-size:30px;width:44px;text-align:center;flex:none}
.m2ins .tx{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.m2ins .tx small{color:var(--muted);font-size:13px;font-weight:650;text-transform:uppercase;letter-spacing:.04em}
.m2ins .tx b{font-size:18px}
.m2ins .tx span{color:var(--muted);font-size:14px}
.m2ins .ia{font-size:13px!important;font-weight:650}
.m2ins .ia.good{color:var(--good)!important} .m2ins .ia.bad{color:var(--bad)!important}
.m2ins .go{font-size:26px;color:var(--faint)}

/* Snackbar (Undo / Edit) */
.snack{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:95;max-width:520px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:6px 6px 6px 16px;min-height:56px;border-radius:16px;background:#111827;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.3);transform:translateY(140%);opacity:0;transition:transform .28s var(--spring),opacity .2s;overflow:hidden;pointer-events:none}
.snack.on{transform:none;opacity:1;pointer-events:auto}
.snack .sn-t{flex:1;font-weight:600;font-size:15px}
.snack .sn-b{border:0;background:transparent;color:#a5b4fc;font:inherit;font-weight:800;font-size:15px;min-height:var(--tap);min-width:var(--tap);padding:0 12px;border-radius:12px;cursor:pointer}
.snack .sn-b:active{background:rgba(255,255,255,.1)}
.snack .sn-bar{position:absolute;left:0;bottom:0;height:3px;background:#818cf8;width:100%;transform-origin:left}
.snack.on .sn-bar{animation:snbar 5s linear forwards}
@keyframes snbar{to{transform:scaleX(0)}}
@media (min-width:721px){.snack{bottom:24px}}

/* Mini sheet */
.m2sheet{position:fixed;inset:0;z-index:90;pointer-events:none}
.m2sheet .m2scrim{position:absolute;inset:0;background:rgba(15,23,42,.45);opacity:0;transition:opacity .22s}
.m2sheet .m2panel{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--panel);border-radius:22px 22px 0 0;padding:6px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(0,0,0,.25);transform:translateY(105%);transition:transform .32s var(--spring);max-height:88vh;overflow:auto}
.m2sheet.on{pointer-events:auto} .m2sheet.on .m2scrim{opacity:1} .m2sheet.on .m2panel{transform:none}
.m2panel .grab{width:44px;height:5px;border-radius:9px;background:var(--border);margin:6px auto 8px}
.m2sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.m2sh b{font-size:20px}
.m2close{width:var(--tap);height:var(--tap);border:0;border-radius:50%;background:var(--panel2);color:var(--muted);font-size:18px;cursor:pointer}
.m2lbl{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:12px 2px 8px}
.m2pills{display:flex;flex-wrap:wrap;gap:8px}
.m2pill{min-height:var(--tap);padding:0 16px;border-radius:99px;border:1.5px solid var(--border);background:var(--panel);color:var(--text);font:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:transform .12s var(--ease),background .15s,border-color .15s}
.m2pill.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.m2grid2,.m2grid3{display:grid;gap:10px;margin-top:14px}
.m2grid2{grid-template-columns:1fr 1fr} .m2grid3{grid-template-columns:repeat(3,1fr)}
.m2big{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:96px;padding:10px 6px;border-radius:18px;border:0;background:var(--accent);color:#fff;font:inherit;cursor:pointer;box-shadow:0 6px 18px rgba(79,70,229,.3);transition:transform .12s var(--ease)}
.m2big .e{font-size:30px;line-height:1} .m2big b{font-size:16px} .m2big small{font-size:12px;opacity:.85}
.m2link{display:block;width:100%;margin-top:12px;min-height:var(--tap);border:0;background:transparent;color:var(--accent);font:inherit;font-weight:650;font-size:15px;cursor:pointer}
.m2list{display:flex;flex-direction:column;gap:8px}
.m2row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:14px}
.m2row small{display:block;color:var(--muted);font-size:13px} .m2row .btn{min-height:var(--tap);font-size:15px;border-radius:12px}

/* Press feedback */
.m2primary,.m2second,.m2tile,.m2big,.m2pill,.m2chip,.m2ins{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.pressed,.m2primary:active,.m2second:active,.m2tile:active,.m2big:active,.m2pill:active,.m2chip:active,.m2ins:active{transform:scale(.96)}

@media (max-width:720px){
  /* Home replaces the Today banner; the banner is one tap away (Details) */
  .m2home{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
  body:not(.m2details) #v-today #today{display:none}
  .m2hero{display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px;background:linear-gradient(135deg,var(--panel),var(--panel2));border:1px solid var(--border);box-shadow:var(--shadow);cursor:pointer;position:relative;transition:background .4s}
  .m2hero.nap,.m2hero.night{background:linear-gradient(135deg,#312e81,#1e1b4b);color:#e0e7ff;border-color:transparent}
  .m2hero.nap .m2next,.m2hero.night .m2next,.m2hero.nap .m2who,.m2hero.night .m2who,.m2hero.nap .m2chev,.m2hero.night .m2chev{color:#c7d2fe}
  .m2hero.flip{animation:m2flip .45s var(--ease)}
  @keyframes m2flip{from{opacity:.4;transform:scale(.98)}to{opacity:1;transform:none}}
  .m2ic{position:relative;width:72px;height:72px;flex:none}
  .m2ic span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:32px}
  .m2ring{width:72px;height:72px;transform:rotate(-90deg)}
  .m2ring circle{fill:none;stroke-width:6}
  .m2ring .bg{stroke:var(--border)} .m2hero.nap .m2ring .bg,.m2hero.night .m2ring .bg{stroke:rgba(255,255,255,.15)}
  .m2ring .fg{stroke:var(--good);stroke-linecap:round;transition:stroke-dashoffset .6s var(--ease),stroke .4s}
  .m2ring.warn .fg{stroke:var(--warn)} .m2ring.bad .fg{stroke:var(--bad)}
  .m2hero.nap .m2ring .fg,.m2hero.night .m2ring .fg{stroke:#a5b4fc}
  .m2st{flex:1;min-width:0}
  .m2who{font-size:13px;color:var(--muted);font-weight:600}
  .m2state{font-size:24px;font-weight:800;line-height:1.15;margin:2px 0}
  .m2t{font-variant-numeric:tabular-nums;font-size:28px}
  .m2next{font-size:14px;color:var(--muted)}
  .m2next b{color:inherit;font-weight:700}
  .m2chev{position:absolute;right:12px;top:10px;color:var(--faint);font-size:14px}
  .m2acts{display:flex;gap:10px}
  .m2primary{flex:1;display:flex;align-items:center;gap:12px;min-height:68px;padding:10px 18px;border:0;border-radius:20px;background:var(--accent);color:#fff;font:inherit;text-align:left;box-shadow:0 10px 24px rgba(79,70,229,.38);cursor:pointer;transition:transform .12s var(--ease)}
  .m2primary .e{font-size:28px} .m2primary b{display:block;font-size:19px} .m2primary small{display:block;font-size:13px;opacity:.85}
  .m2second{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:92px;min-height:68px;border:1.5px solid var(--border);border-radius:20px;background:var(--panel);color:var(--text);font:inherit;font-size:13px;cursor:pointer;transition:transform .12s var(--ease)}
  .m2second .e{font-size:22px}
  .m2tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .m2tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:96px;padding:10px 4px;border-radius:18px;border:1px solid var(--border);background:var(--panel);color:var(--text);font:inherit;box-shadow:var(--shadow);cursor:pointer;overflow:hidden;transition:transform .12s var(--ease)}
  .m2tile .e{font-size:30px;line-height:1} .m2tile b{font-size:15px} .m2tile small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .m2tile.warn{border-color:var(--warn);background:var(--warn-soft)}
  .m2tile .ok{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--good);color:#fff;font-size:36px;font-style:normal;opacity:0;transform:scale(.6);pointer-events:none}
  .m2tile.done .ok{animation:m2ok .9s var(--ease)}
  @keyframes m2ok{15%{opacity:1;transform:scale(1)}70%{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.05)}}
  .m2chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:2px 12px}
  .m2chips::-webkit-scrollbar{display:none}
  .m2chip{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:92px;min-height:60px;padding:8px 12px;border-radius:16px;border:1px solid var(--border);background:var(--panel);color:var(--text);font:inherit;text-align:left;cursor:pointer;transition:transform .12s var(--ease)}
  .m2chip b{font-size:17px;font-variant-numeric:tabular-nums} .m2chip small{font-size:12px;color:var(--muted)}
  .m2chip .mt{display:block;width:100%;height:4px;border-radius:4px;background:var(--panel2);overflow:hidden;margin-top:2px} .m2chip .mt b{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .5s var(--ease)}
  .m2chip.tick b:first-child{animation:m2tick .35s var(--spring)}
  @keyframes m2tick{40%{transform:scale(1.18)}}
  .m2cards{display:flex;flex-direction:column;gap:8px}
  .m2card{position:relative;margin:0!important;padding:12px 48px 12px 14px!important;border-radius:16px!important;font-size:14.5px;line-height:1.45;transition:transform .2s var(--ease),opacity .2s}
  .m2card .btn{min-height:44px;font-size:14.5px;border-radius:12px;margin-top:6px}
  .m2card.gone{transform:translateX(110%)!important;opacity:0!important}
  .m2x{position:absolute;right:2px;top:2px;width:var(--tap);height:var(--tap);border:0;background:transparent;color:var(--muted);font-size:15px;cursor:pointer;border-radius:12px}
  /* Bottom bar: bigger, with a raised ＋ */
  .bbar{padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bbar button{min-height:58px;font-size:11.5px;border-radius:14px;transition:transform .12s var(--ease),color .15s}
  .bbar button .ti{font-size:24px}
  .bbar .bplus i{width:60px;height:48px;border-radius:18px;transform:translateY(-10px);transition:transform .15s var(--spring)}
  .bbar .bplus.pressed i,.bbar .bplus:active i{transform:translateY(-10px) scale(.92)}
  /* Quick Log tiles: three across, bigger */
  #qlog .presets{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:10px!important}
  #qlog .preset{border-radius:18px;min-height:96px;transition:transform .12s var(--ease)}
  #qlog .preset.live{background:var(--accent);color:#fff;border-color:var(--accent)}
  #qlog .preset.live .faint{color:#e0e7ff!important}
  #qlog{transition:transform .34s var(--spring)!important}
  #qlog .linkbtn{display:inline-flex;align-items:center;min-height:44px;min-width:44px;padding:0 8px}
  /* Entries and plan rows a little roomier */
  #todayEv .feed li,#planList .pl-row{min-height:52px}
}
@media (prefers-reduced-motion: reduce){
  .pressed,.m2primary:active,.m2second:active,.m2tile:active,.m2big:active,.m2pill:active,.m2chip:active,.m2ins:active{transform:none}
  .m2hero.flip,.m2tile.done .ok,.m2chip.tick b:first-child{animation:none}
  .snack,.m2sheet .m2panel,#qlog,.m2card{transition:opacity .15s!important}
}
</style>
